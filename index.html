<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドキドキ クレーンゲーム</title>
<style>
:root{--bg:#fff1d6;--fg:#3b2412;--panel:#ffffff;--red:#e63946;--blue:#2b7de9;--yel:#ffc928;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1530;--fg:#f6eefc;--panel:#2c2244;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1530;--fg:#f6eefc;--panel:#2c2244;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-touch-callout:none}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:10px 0 2px;font-size:20px;letter-spacing:.04em}
.hud{display:flex;gap:10px;margin:4px 0 8px;font-weight:700;font-size:15px}
.hud span{background:var(--panel);padding:4px 12px;border-radius:999px}
.wrap{position:relative;width:min(100%,calc((100svh - 250px)*.72));min-width:260px}
canvas{display:block;width:100%;height:auto;aspect-ratio:360/500;border-radius:14px;border:5px solid var(--red);box-sizing:border-box;background:#2b2a5a}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 10px}
.ctl button{border:0;font:inherit;font-weight:800;color:#fff;cursor:pointer;border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.28);touch-action:none}
.ctl button:active,.ctl button.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.dir{width:68px;height:68px;font-size:26px;background:var(--blue)}
.go{width:92px;height:92px;font-size:17px;background:var(--red)}
.go:disabled,.dir:disabled{opacity:.45}
#res{position:absolute;inset:5px;border-radius:10px;background:rgba(20,12,40,.88);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px}
#res.show{display:flex}
#res h2{margin:0;font-size:24px}
#res .sc{font-size:34px;font-weight:800;color:var(--yel)}
#res .em{font-size:28px;min-height:34px;line-height:1.3}
#res button{margin-top:8px;border:0;border-radius:999px;background:var(--yel);color:#3b2412;font:inherit;font-weight:800;font-size:17px;padding:12px 28px;cursor:pointer}
.tip{font-size:12px;opacity:.75;margin:0 0 8px}
.gal{width:min(100%,420px);margin:6px 0 30px;padding:0 10px;box-sizing:border-box}
.gal h2{font-size:17px;margin:8px 0 2px}
.bar{height:10px;background:var(--panel);border-radius:999px;overflow:hidden;margin:6px 0}
.bar b{display:block;height:100%;width:0;background:var(--red);transition:width .6s}
.rv{position:relative;border-radius:12px;overflow:hidden;border:5px solid var(--yel);box-sizing:border-box;background:#111}
.rv img{display:block;width:100%;height:auto}
#caps{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(12,1fr)}
.cap{display:flex;align-items:center;justify-content:center;transition:transform .5s,opacity .5s}
.cap.pop{transform:scale(1.7);opacity:0}
.cap i{font-style:normal;width:84%;height:84%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,5vw,23px);box-shadow:inset -3px -4px 0 rgba(0,0,0,.14),inset 3px 3px 0 rgba(255,255,255,.55)}
#nx{font-size:13px;margin:4px 0}
.mode{display:flex;gap:8px;margin:2px 0 4px}
.mode button{border:0;font:inherit;font-weight:800;padding:6px 18px;border-radius:999px;background:var(--panel);color:var(--fg);cursor:pointer;opacity:.7}
.mode button.on{background:var(--red);color:#fff;opacity:1}
#rst{border:0;background:none;color:inherit;opacity:.6;font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:6px 0}
</style></head><body>
<h1>ドキドキ クレーンゲーム</h1>
<div class="mode"><button id="m0">ふつう</button><button id="m1">🔥上級</button></div>
<div class="hud"><span>残り <b id="cr">6</b> 回</span><span>スコア <b id="sc">0</b></span><span id="hs" style="cursor:pointer">公開 <b id="hp">0</b>%</span></div>
<div class="wrap">
<canvas id="c"></canvas>
<div id="res"><h2 id="rt"></h2><div class="sc" id="rs"></div><div class="em" id="re"></div><div id="rm"></div><div id="rg"></div><button id="again">もう一度あそぶ</button></div>
</div>
<div class="ctl">
<button class="dir" id="bl" aria-label="左へ">◀</button>
<button class="go" id="bg">キャッチ！</button>
<button class="dir" id="br" aria-label="右へ">▶</button>
</div>
<p class="tip">◀ ▶ を押している間クレーンが動きます（キーボード：矢印 / スペース）</p>

function beep(f,d=.09,t='square',v=.04){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.type=t;o.frequency.value=f;gn.gain.value=v;o.connect(gn);gn.connect(ac.destination);o.start();gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const MODES=[{cr:6,gr:.85,gm:.35,su:.0025,sh:.002,tm:0,x:1},{cr:5,gr:.62,gm:.15,su:.004,sh:.003,tm:10,x:2}];
let mode=0;try{mode=localStorage.getItem('craneMode1')==='1'?1:0}catch(e){}
function setMode(m,fresh){mode=m;try{localStorage.setItem('craneMode1',m)}catch(e){}document.getElementById('m0').classList.toggle('on',m===0);document.getElementById('m1').classList.toggle('on',m===1);if(fresh)init()}
const COLS=8,ROWS=12,N=COLS*ROWS,PER=200,EMO=['🎁','⭐','🧸','🍩','🐰','🍙','🐱','👑'];
function shuffled(){const a=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let sv={total:0,order:null};
try{const q=JSON.parse(localStorage.getItem('craneReveal1')||'null');if(q&&Array.isArray(q.order)&&q.order.length===N&&q.total>=0)sv=q}catch(e){}
if(!sv.order)sv.order=shuffled();
function save(){try{localStorage.setItem('craneReveal1',JSON.stringify(sv))}catch(e){}}
function opened(){return Math.min(N,Math.floor(sv.total/PER))}
function buildGallery(){const box=document.getElementById('caps');box.innerHTML='';
  for(let i=0;i<N;i++){const d=document.createElement('div');d.className='cap';const h=(i*47+Math.floor(i/COLS)*23)%360;
    d.style.background=`hsl(${h} 70% 80%)`;d.innerHTML=`<i style="background:hsl(${h} 85% 66%)">${EMO[i%EMO.length]}</i>`;box.appendChild(d)}
  renderReveal(false)}
function renderReveal(anim){const n=opened(),cells=document.getElementById('caps').children;let d=0;
  for(let k=0;k<N;k++){const c=cells[sv.order[k]];if(!c)continue;
    if(k<n&&!c.classList.contains('pop')){if(anim){c.style.transitionDelay=(d*.18)+'s';setTimeout(()=>{c.style.display='none'},700+d*180);d++}else c.style.display='none';c.classList.add('pop')}}
  const pct=Math.round(n/N*100);
  document.getElementById('pct').textContent=pct+'%';document.getElementById('hp').textContent=pct;
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('nx').textContent=n>=N?'🎉 コンプリート！ごほうび画像がすべて見えました':`累計 ${sv.total} 点・次のカプセルまであと ${PER-sv.total%PER} 点`}
function addTotal(p){const b=opened();sv.total=Math.min(sv.total+p,N*PER);save();renderReveal(true);return opened()-b}
function hud(){document.getElementById('cr').textContent=credits;document.getElementById('sc').textContent=score;
  const dis=cl.s!=='idle'||credits<=0;['bl','br','bg'].forEach(i=>document.getElementById(i).disabled=dis)}
function init(){
  P=[];credits=MODES[mode].cr;score=0;won=[];msg='';msgT=0;
  cl={x:W/2+40,y:TOP,a:A_OPEN,s:'idle',held:null,t:0,tl:MODES[mode].tm*60};
  for(let i=0;i<16;i++){const t=T[i<2?8-i*0:Math.floor(Math.random()*8)];
    P.push({...t,x:CH+25+Math.random()*(W-CH-50),y:FLOOR-300+Math.random()*200,vx:0,vy:0,held:false,col:`hsl(${Math.floor(Math.random()*360)} 85% 82%)`})}
  for(let k=0;k<500;k++)phys(true);
  document.getElementById('res').classList.remove('show');hud();
}
function phys(quiet){
  for(const p of P){ if(p.held)continue;
    p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;
    if(p.x<p.r&&p.y<FLOOR){p.x=p.r;p.vx*=-.3}
    if(p.x>W-p.r){p.x=W-p.r;p.vx*=-.3}
    if(p.x>CH&&p.y>FLOOR-p.r&&p.y<FLOOR+10){p.y=FLOOR-p.r;p.vy*=-.2;p.vx*=.9}
  }
  for(let k=0;k<3;k++)for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j];if(a.held||b.held)continue;
    const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;if(Math.abs(dx)>m||Math.abs(dy)>m)continue;
    const d=Math.hypot(dx,dy);if(d>=m||d<.001)continue;
    const nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
    const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(vn<0){const jj=-vn*.55;a.vx-=jj*nx;a.vy-=jj*ny;b.vx+=jj*nx;b.vy+=jj*ny}
  }
  if(!quiet){
    for(const [tx,ty] of tips())for(const p of P){if(p.held)continue;
      const dx=p.x-tx,dy=p.y-ty,d=Math.hypot(dx,dy),m=p.r+7;
      if(d<m&&d>.001){p.x=tx+dx/d*m;p.y=ty+dy/d*m;p.vx+=dx/d*.4}}
    for(let i=P.length-1;i>=0;i--){const p=P[i];
      if(p.y>H+p.r){P.splice(i,1);const pt=p.p*MODES[mode].x;score+=pt;won.push(p.e);const o=addTotal(pt);msg=`GET！ ${p.e} +${pt}`+(o?`\nカプセル ${o}個ひらいた！`:'');msgT=130;
        [660,880,1100].forEach((f,n)=>setTimeout(()=>beep(f,.12,'triangle',.07),n*90));hud()}}
  }
}
function tips(){const o=8+Math.sin(cl.a)*L,ty=cl.y+6+Math.cos(cl.a)*L;return[[cl.x-o,ty],[cl.x+o,ty]]}
function grab(){const c=cl;let best=null,bd=1e9;
  for(const p of P){const dx=p.x-c.x,d=Math.hypot(dx,p.y-(c.y+30));
    if(Math.abs(dx)<30&&p.y>c.y+8&&p.y<c.y+L+p.r&&d<bd){best=p;bd=d}}
  if(best&&Math.random()<Math.max(MODES[mode].gm,MODES[mode].gr-(best.r-15)*.035)){best.held=true;c.held=best;beep(520,.12);msg='つかんだ！';msgT=60}
  else{msg=best?'スカッ…':'空振り…';msgT=70;beep(180,.2,'sawtooth')}}
function slip(r){const c=cl;if(c.held&&Math.random()<r*c.held.r/20){c.held.held=false;c.held.vy=0;c.held=null;msg='ポロッ…！';msgT=80;beep(150,.25,'sawtooth')}}
function start(){if(cl.s!=='idle'||credits<=0)return;credits--;cl.s='down';beep(400,.1);hud()}
function step(){
  frame++;phys();const c=cl;
  if(c.s==='idle'){if(MODES[mode].tm&&credits>0&&--c.tl<=0)start();if(keys.l)c.x-=2.2;if(keys.r)c.x+=2.2;c.x=Math.max(22,Math.min(W-22,c.x));c.a+=(A_OPEN-c.a)*.2}
  else if(c.s==='down'){c.y+=3.2;if(c.y>=MAXY){c.y=MAXY;c.s='close'}}
  else if(c.s==='close'){c.a-=.025;if(c.a<=A_CLOSE){c.a=A_CLOSE;grab();c.s='up'}}
  else if(c.s==='up'){c.y-=2.2;slip(MODES[mode].su);if(c.y<=TOP){c.y=TOP;c.s='home'}}
  else if(c.s==='home'){const d=HOMEX-c.x;c.x+=Math.sign(d)*Math.min(Math.abs(d),2);slip(MODES[mode].sh);if(Math.abs(d)<.5){c.s='drop';c.t=0}}
  else if(c.s==='drop'){c.t++;c.a=Math.min(A_OPEN,c.a+.05);
    if(c.held&&c.a>.55){c.held.held=false;c.held=null}
    if(c.t>90){c.s='idle';c.tl=MODES[mode].tm*60;hud();if(credits<=0)finish()}}
  if(c.held){c.held.x=c.x;c.held.y=c.y+6+L*.8;c.held.vx=c.held.vy=0}
  if(msgT>0)msgT--;
}
function finish(){
  const r=document.getElementById('res');
  document.getElementById('rt').textContent=mode?'🔥上級モード 終了！':'ゲーム終了！';
  document.getElementById('rs').textContent=score+' 点';
  document.getElementById('re').textContent=won.length?won.join(' '):'景品なし';
  document.getElementById('rm').textContent=score===0?'残念…次は取れるはず！':score<200?'いいね！コツをつかんできた':score<400?'上手！クレーンの達人':'名人級！お見事！';
  document.getElementById('rg').textContent=`🎁 ごほうび画像 ${Math.round(opened()/N*100)}% 公開（累計 ${sv.total} 点）`;r.classList.add('show');
}
function draw(){
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2b2a5a');gr.addColorStop(1,'#5a3d8a');g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<12;i++){g.fillStyle=`hsl(${(i*40+frame*3)%360} 90% 65%)`;g.beginPath();g.arc(15+i*30,18,4,0,7);g.fill()}
  g.fillStyle='#8a8aa8';g.fillRect(0,0,W,8);
  g.fillStyle='#e0a63e';g.fillRect(CH,FLOOR,W-CH,H-FLOOR);
  g.fillStyle='#c98a22';g.fillRect(CH,FLOOR,W-CH,6);
  g.fillStyle='#100c24';g.fillRect(0,FLOOR,CH,H-FLOOR);
  g.fillStyle='#ffc928';g.fillRect(CH-5,FLOOR-2,5,H);
  g.fillStyle='#fff';g.font='bold 14px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('取り出し口 ▼',CH/2,FLOOR+22);
  for(const p of P){g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();
    g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,p.r-3,3.6,4.6);g.stroke();
    g.font=`${Math.round(p.r*1.35)}px serif`;g.fillStyle='#000';g.fillText(p.e,p.x,p.y+1)}
  const c=cl;
  g.strokeStyle='#d0d0dc';g.lineWidth=3;g.beginPath();g.moveTo(c.x,8);g.lineTo(c.x,c.y);g.stroke();
  g.fillStyle='#c8c8d6';g.fillRect(c.x-14,0,28,10);
  g.fillStyle='#ff5a6a';g.beginPath();g.roundRect(c.x-14,c.y-6,28,18,5);g.fill();
  g.strokeStyle='#f2f2fa';g.lineWidth=5;g.lineCap='round';
  for(const s of[-1,1]){const px=c.x+s*8,py=c.y+6,o=8+Math.sin(c.a)*L,ty=c.y+6+Math.cos(c.a)*L;
    g.beginPath();g.moveTo(px,py);g.lineTo(c.x+s*o,ty);g.stroke()}
  if(MODES[mode].tm&&cl.s==='idle'&&credits>0){g.font='bold 20px sans-serif';g.textAlign='right';g.fillStyle=cl.tl<180?'#ff5a6a':'#fff';g.fillText('⏱ '+Math.ceil(cl.tl/60),W-12,38);g.textAlign='center'}if(msgT>0){g.globalAlpha=Math.min(1,msgT/30);msg.split('\n').forEach((t,i)=>{g.font=(i?'bold 18px':'bold 26px')+' sans-serif';g.lineWidth=5;g.strokeStyle='#3b2412';g.strokeText(t,W/2+30,150+i*30);g.fillStyle='#ffe35a';g.fillText(t,W/2+30,150+i*30)});g.globalAlpha=1}
}
let last=0,acc=0;
function loop(t){const dt=Math.min(100,t-last);last=t;acc+=dt;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}
function hold(id,k){const b=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on')},off=()=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off))}
hold('bl','l');hold('br','r');
document.getElementById('bg').addEventListener('pointerdown',e=>{e.preventDefault();start()});
document.getElementById('again').addEventListener('click',()=>{init()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.key===' '||e.key==='Enter'){e.preventDefault();start()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false});
buildGallery();setMode(mode,false);init();document.getElementById('m0').onclick=()=>setMode(0,true);document.getElementById('m1').onclick=()=>setMode(1,true);requestAnimationFrame(loop);
document.getElementById('hs').addEventListener('click',()=>document.getElementById('gal').scrollIntoView({behavior:'smooth'}));
let rc=false;document.getElementById('rst').addEventListener('click',e=>{const b=e.target;
  if(!rc){rc=true;b.textContent='本当にリセット？もう一度押すと消えます';setTimeout(()=>{rc=false;b.textContent='進捗をリセット'},3000)}
  else{rc=false;sv={total:0,order:shuffled()};save();buildGallery();b.textContent='進捗をリセット'}});
</script></body></html>
